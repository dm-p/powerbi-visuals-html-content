name: ci

# Maintainer runbook — how to cut releases:
#
#   Channel drop (alpha shown; beta is identical):
#       git tag 2.0.0.alpha-1 <commit>
#       git tag -f alpha <commit>
#       git push origin 2.0.0.alpha-1
#       git push -f origin alpha
#   -> the rolling "Alpha Channel" prerelease is replaced with this build.
#
#   Always move the bare 'alpha'/'beta' tags. A suffixed moving tag (e.g.
#   'alpha-2') creates a SEPARATE rolling release keyed to that tag name
#   instead of replacing the 'alpha' one.
#
#   Certification submission:
#       # bump visual.version in pbiviz.json to 2.0.0.0 and commit
#       git tag 2.0.0.0 <commit>
#       git push origin 2.0.0.0
#   -> the `submission` job gates the commit and uploads the workflow artifact
#      HTML-Content.2.0.0.0 (all three .pbiviz). Download it and submit the
#      regular + Secure packages to Partner Center. No release is created —
#      submission tags are remediation iterations and the tag is the durable
#      record. Rejected? Fix, bump to 2.0.0.1, commit, tag and push again.
#
#   Production release (after Microsoft approves a submission tag):
#       Actions -> release -> Run workflow (from main), tag = 2.0.0.1
#   -> a DRAFT release named "2.0.0" is created for proofing; publish it
#      manually. See .github/workflows/release.yml.

# Default the workflow token to read-only; each job that publishes elevates
# to contents: write itself (release create/delete).
permissions:
    contents: read

# One run per ref at a time. Branch/PR runs supersede freely — a cancelled
# test run strands nothing. Tag runs never cancel: a half-finished prerelease
# is exactly the state that strands a deleted release.
concurrency:
    group: ci-${{ github.ref_name }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

on:
    push:
        branches: [main, certification-remediation]
        tags:
            - 'alpha'
            - 'alpha-*'
            - 'beta'
            - 'beta-*'
            # Certification submission tags (4-part, e.g. 2.0.0.0). The glob
            # is looser than the real rule; the submission job re-validates
            # with an exact regex.
            - '[0-9]*.[0-9]*.[0-9]*.[0-9]*'
    # Run on PRs to any base branch so the check is reported on the PR
    # (e.g. feature branches targeting release lines like 2.0.0).
    pull_request:

jobs:
    test:
        # Branch pushes and PRs only; tag pushes are handled by the
        # prerelease / submission jobs below (submission runs this same gate).
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - run: npx playwright install --with-deps chromium
            - name: Lint
              run: npm run eslint
            - name: Unit tests
              run: npm run test
            - name: Docs drift check
              run: npm run docs:check
            - name: Integration tests
              run: npm run test:integration

    prerelease:
        if: startsWith(github.ref, 'refs/tags/alpha') || startsWith(github.ref, 'refs/tags/beta')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Fetch all tags
              run: git fetch --tags --force
            # Derive the release channel from the moving tag name
            # ('alpha'/'beta', including 'alpha-*'/'beta-*' variants). Every
            # later step keys off these outputs, so alpha and beta cannot
            # drift apart. $GITHUB_REF_NAME (env var, quoted) rather than
            # ${{ github.ref_name }}: expression interpolation would paste the
            # raw tag name into the script as shell source.
            - name: Resolve release channel
              id: channel
              run: |
                  CHANNEL="${GITHUB_REF_NAME%%-*}"
                  case "$CHANNEL" in
                      alpha|beta) ;;
                      *)
                          echo "::error::Unsupported prerelease channel '$CHANNEL' (from tag '$GITHUB_REF_NAME')."
                          exit 1
                          ;;
                  esac
                  echo "name=$CHANNEL" >> $GITHUB_OUTPUT
                  echo "prefix=$(echo "$CHANNEL" | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
                  echo "title=${CHANNEL^}" >> $GITHUB_OUTPUT
                  echo "Channel: $CHANNEL"
            # The moving channel tag must be accompanied by a versioned
            # channel tag (e.g. `2.0.0.beta-1`) on the same commit — it names
            # the published .pbiviz files and the release title. Fail fast
            # (before install/build) if it is missing.
            - name: Resolve versioned channel tag
              id: version_tag
              run: |
                  VERSION_TAG=$(git tag --points-at HEAD | grep -E "^[0-9]+\.[0-9]+\.[0-9]+\.${{ steps.channel.outputs.name }}-[0-9]+$" | sort -V | tail -n 1 || true)
                  if [ -z "$VERSION_TAG" ]; then
                      echo "::error::No versioned ${{ steps.channel.outputs.name }} tag (e.g. 2.0.0.${{ steps.channel.outputs.name }}-1) found on this commit. Tag the commit with '<major>.<minor>.<patch>.${{ steps.channel.outputs.name }}-<n>' and re-push the '${{ steps.channel.outputs.name }}' tag to release."
                      exit 1
                  fi
                  echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
                  echo "Versioned channel tag: $VERSION_TAG"
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - name: Prepare artifact staging
              run: mkdir -p release-artifacts
            # Channel packages: regular (standard) + secure (certified), each
            # with the channel overlay (prefixed GUID, suffixed displayName,
            # channel icon). dist/ is cleared before each package so the mv
            # glob below can only ever match the single fresh artifact (mv
            # fails the job on zero or multiple matches).
            - name: Package regular edition (channel build)
              run: |
                  rm -rf dist .tmp/drop
                  node scripts/select-edition.mjs standard ${{ steps.channel.outputs.name }}
                  npx pbiviz package
                  node scripts/check-no-sanitizer.mjs
                  node scripts/assert-channel-identity.mjs ${{ steps.channel.outputs.prefix }}
                  mv dist/*.pbiviz "release-artifacts/HTML-Content.${{ steps.version_tag.outputs.tag }}.pbiviz"
            - name: Package secure edition (channel build)
              run: |
                  rm -rf dist .tmp/drop
                  node scripts/select-edition.mjs certified ${{ steps.channel.outputs.name }}
                  npx pbiviz package
                  node scripts/check-no-sanitizer.mjs --expect-sanitizer
                  node scripts/assert-channel-identity.mjs ${{ steps.channel.outputs.prefix }}
                  mv dist/*.pbiviz "release-artifacts/HTML-Content-Secure.${{ steps.version_tag.outputs.tag }}.pbiviz"
            # Both editions' stamps are identical (buildStamp() is a pure
            # function of HEAD), so reading the last drop is authoritative.
            # Read it from the packaged output — never recompute the
            # YYYYMMDD#hash format here (single source of truth lives in
            # scripts/select-edition.mjs).
            - name: Resolve stamped visual version
              id: stamp
              run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('.tmp/drop/pbiviz.json','utf8')).visual.version")" >> $GITHUB_OUTPUT
            # Only pure 4-part numeric tags (e.g. 1.6.2.0) are production
            # releases. Positively match that shape so channel tags can never
            # become the changelog baseline — drift is always measured from
            # the last shipped production release.
            - name: Get last release tag
              id: last_tag
              run: |
                  LAST_TAG=$(git tag -l '[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
                  if [ -z "$LAST_TAG" ]; then
                      echo "::error::No 4-part production tag found to use as the changelog baseline."
                      exit 1
                  fi
                  echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
                  echo "Last versioned tag: $LAST_TAG"
            - name: Generate changelog
              id: changelog
              # Third-party actions in this workflow run with a write-scoped
              # token, so they are pinned to reviewed commit SHAs rather than
              # mutable tags (supply-chain hardening).
              uses: requarks/changelog-action@1fabc7b0c6581d93c398246a856f084fb17cd9eb # v1.9.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fromTag: ${{ steps.version_tag.outputs.tag }}
                  toTag: ${{ steps.last_tag.outputs.tag }}
                  excludeTypes: ''
                  writeToFile: false
            - name: Delete existing channel release
              run: gh release delete "$GITHUB_REF_NAME" --yes || true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Create channel pre-release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: '${{ steps.channel.outputs.title }} Channel: Latest Build (${{ steps.version_tag.outputs.tag }})'
                  prerelease: true
                  body: |
                      HTML Content ${{ steps.channel.outputs.title }} Channel build — the latest early-access build for testing and feedback.

                      Two packages are attached, one per edition:

                      | Package | Edition | What it does |
                      | --- | --- | --- |
                      | `HTML-Content.${{ steps.version_tag.outputs.tag }}.pbiviz` | **HTML Content** | Full HTML rendering, including external content where your tenant allows it. |
                      | `HTML-Content-Secure.${{ steps.version_tag.outputs.tag }}.pbiviz` | **HTML Content Secure** | Sanitizes markup and blocks external communication, matching the behavior of the certified AppSource visual. |

                      Both packages use channel-specific visual IDs (prefixed `${{ steps.channel.outputs.prefix }}`), so they can be side-loaded into reports alongside the AppSource or production visuals without interfering with them, and they will not auto-update.

                      > **Note on the Secure edition:** this build is **not** tied to AppSource and carries **none of the certification benefits** of the published certified visual. It is provided so you can verify that sanitization and external-communication blocking work as expected against your own content before the certified release catches up.

                      **These builds are not supported for production use** and are intended for testing and feedback only.

                      When reporting issues, please quote the full package filename (e.g. `HTML-Content.${{ steps.version_tag.outputs.tag }}.pbiviz`) together with the in-visual version shown on the landing page and in the visualizations pane (`${{ steps.stamp.outputs.version }}` for this build) — the filename identifies the edition and drop; the in-visual version pins the exact commit.

                      ---

                      ## Changes since ${{ steps.last_tag.outputs.tag }}

                      ${{ steps.changelog.outputs.changes }}
                  files: |
                      release-artifacts/*.pbiviz
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # Keep the built packages retrievable even when a later step
            # fails, so a broken run can be diagnosed and hand-published
            # without a rebuild. Purely diagnostic: must never affect job
            # status (continue-on-error), must survive re-runs (overwrite).
            - name: Upload artifacts for diagnosis
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: release-artifacts
                  path: release-artifacts/*.pbiviz
                  if-no-files-found: warn
                  overwrite: true

    submission:
        # Certification submission build. Negative gate: every ref admitted
        # by on.push.tags that is NOT a moving channel tag lands here; the
        # exact-shape validation step is what rejects strays loudly.
        # Uploads all three editions as a workflow artifact only —
        # deliberately no release object: submission tags are throwaway
        # remediation iterations and the tag itself is the durable record.
        # The approved tag is later published via release.yml.
        if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/alpha') && !startsWith(github.ref, 'refs/tags/beta') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # The on.push tag glob is looser than the real rule, so validate
            # the exact 4-part shape here, and require the tag to equal
            # pbiviz.json's visual.version (fail fast on drift). The tag names
            # the packages that get submitted to Partner Center, so it must be
            # the exact version baked into them. $GITHUB_REF_NAME env-var
            # form: see prerelease job note. Runs before setup-node on
            # purpose (fail fast, before the expensive gate): the `node -p`
            # below uses the runner image's preinstalled Node, which is fine
            # for JSON.parse/readFileSync.
            - name: Validate submission tag
              run: |
                  if ! echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::Tag '$GITHUB_REF_NAME' is not a 4-part submission version tag (e.g. 2.0.0.0)."
                      exit 1
                  fi
                  PBIVIZ_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('pbiviz.json','utf8')).visual.version")
                  if [ "$GITHUB_REF_NAME" != "$PBIVIZ_VERSION" ]; then
                      echo "::error::Tag '$GITHUB_REF_NAME' does not match pbiviz.json visual.version '$PBIVIZ_VERSION'. Bump pbiviz.json, commit, and re-tag."
                      exit 1
                  fi
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            # Full quality gate — a submission never goes to Microsoft
            # untested. Mirrors the `test` job above.
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - run: npx playwright install --with-deps chromium
            - name: Lint
              run: npm run eslint
            - name: Unit tests
              run: npm run test
            - name: Docs drift check
              run: npm run docs:check
            - name: Integration tests
              run: npm run test:integration
            - name: Prepare artifact staging
              run: mkdir -p release-artifacts
            # Submission packages: all three editions with their committed
            # (production) GUIDs — no channel overlay — named with the 4-part
            # tag (the submission identity). dist/ is cleared before each
            # package so the mv glob can only match the single fresh artifact
            # (mv fails the job on zero or multiple matches). The non-secure
            # editions are checked for sanitizer leakage immediately after
            # packaging (the check reads the webpack drop, which the next
            # package run overwrites).
            - name: Package regular edition
              run: |
                  rm -rf dist .tmp/drop
                  node scripts/select-edition.mjs standard
                  npx pbiviz package
                  node scripts/check-no-sanitizer.mjs
                  node scripts/assert-production-version.mjs "$GITHUB_REF_NAME"
                  mv dist/*.pbiviz "release-artifacts/HTML-Content.${GITHUB_REF_NAME}.pbiviz"
            - name: Package secure edition
              run: |
                  rm -rf dist .tmp/drop
                  node scripts/select-edition.mjs certified
                  npx pbiviz package
                  node scripts/check-no-sanitizer.mjs --expect-sanitizer
                  node scripts/assert-production-version.mjs "$GITHUB_REF_NAME"
                  mv dist/*.pbiviz "release-artifacts/HTML-Content-Secure.${GITHUB_REF_NAME}.pbiviz"
            - name: Package standalone edition
              run: |
                  rm -rf dist .tmp/drop
                  node scripts/select-edition.mjs standalone
                  npx pbiviz package
                  node scripts/check-no-sanitizer.mjs
                  node scripts/assert-production-version.mjs "$GITHUB_REF_NAME"
                  mv dist/*.pbiviz "release-artifacts/HTML-Content-Standalone.${GITHUB_REF_NAME}.pbiviz"
            # This artifact IS the output of a submission run: download it
            # and upload the regular + Secure packages to Partner Center.
            - name: Upload submission artifact
              uses: actions/upload-artifact@v4
              with:
                  name: HTML-Content.${{ github.ref_name }}
                  path: release-artifacts/*.pbiviz
                  retention-days: 90
                  if-no-files-found: error
